[project]
name = "tpo-market-workbench"
version = "0.1.0"
description = "A TPO-based US equities market analysis workstation"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116.0",
    "playwright>=1.62.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.uv]
package = false
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
